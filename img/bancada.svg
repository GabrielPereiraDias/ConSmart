<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" fill="none">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="dev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363b42"/><stop offset="1" stop-color="#17191c"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101216"/><stop offset="1" stop-color="#07080a"/>
    </linearGradient>
  </defs>
  <style>
    .blink{animation:blink 3s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.blink{animation:none;opacity:1}}
  </style>
  <rect x="2" y="2" width="716" height="556" rx="32" fill="#0d0f11" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <rect x="2" y="2" width="716" height="556" rx="32" fill="url(#grid)"/>
  <!-- tablet -->
  <g transform="rotate(-5 200 170)">
    <rect x="50" y="52" width="330" height="236" rx="22" fill="url(#dev)" stroke="#4d535b" stroke-width="2"/>
    <rect x="66" y="68" width="298" height="204" rx="10" fill="url(#scr)"/>
    <circle cx="215" cy="170" r="48" stroke="#2be06a" stroke-width="3" stroke-opacity=".25"/>
    <circle cx="215" cy="170" r="30" stroke="#2be06a" stroke-width="3" stroke-opacity=".55"/>
    <circle class="blink" cx="215" cy="170" r="9" fill="#2be06a"/>
    <rect x="86" y="86" width="90" height="8" rx="4" fill="#fff" opacity=".14"/>
    <rect x="86" y="102" width="60" height="6" rx="3" fill="#fff" opacity=".07"/>
  </g>
  <!-- celular -->
  <g transform="rotate(9 520 170)">
    <rect x="450" y="40" width="140" height="272" rx="26" fill="url(#dev)" stroke="#4d535b" stroke-width="2"/>
    <rect x="460" y="50" width="120" height="252" rx="18" fill="url(#scr)"/>
    <rect x="496" y="58" width="48" height="12" rx="6" fill="#000"/>
    <g stroke="#2be06a" stroke-width="5" stroke-linecap="round">
      <path d="M489 168a42 42 0 0 1 62 0" opacity=".4"/>
      <path d="M499 182a27 27 0 0 1 42 0" opacity=".7"/>
    </g>
    <circle class="blink" cx="520" cy="198" r="5" fill="#2be06a"/>
  </g>
  <!-- bandeja de parafusos -->
  <rect x="56" y="336" width="270" height="150" rx="18" fill="#14171a" stroke="#3a3f46" stroke-width="2"/>
  <path d="M146 336v150M236 336v150M56 411h270" stroke="#3a3f46" stroke-width="2"/>
  <g fill="#8a9099">
    <circle cx="90" cy="372" r="7"/><circle cx="118" cy="382" r="6"/><circle cx="100" cy="396" r="5"/>
    <circle cx="190" cy="370" r="6"/><circle cx="210" cy="388" r="7"/>
    <circle cx="280" cy="380" r="7"/><circle cx="296" cy="364" r="5"/>
    <circle cx="96" cy="450" r="6"/><circle cx="124" cy="462" r="5"/>
    <circle cx="276" cy="450" r="6"/>
  </g>
  <circle cx="190" cy="452" r="8" fill="#2be06a"/>
  <!-- bateria -->
  <g transform="rotate(-4 450 400)">
    <rect x="370" y="350" width="150" height="86" rx="14" fill="#202327" stroke="#3f454c" stroke-width="2"/>
    <rect x="520" y="378" width="10" height="30" rx="3" fill="#5a616a"/>
    <rect x="388" y="368" width="70" height="8" rx="4" fill="#fff" opacity=".1"/>
    <rect x="388" y="386" width="100" height="8" rx="4" fill="#2be06a" opacity=".8"/>
  </g>
  <!-- chip -->
  <g>
    <rect x="570" y="360" width="84" height="84" rx="10" fill="#15181c" stroke="#3a3f46" stroke-width="2"/>
    <rect x="586" y="376" width="52" height="52" rx="6" fill="#0a0c0e" stroke="#2be06a" stroke-opacity=".5"/>
    <g stroke="#6d747d" stroke-width="3" stroke-linecap="round">
      <path d="M584 352v8M600 352v8M616 352v8M632 352v8M584 444v8M600 444v8M616 444v8M632 444v8M562 376h8M562 392h8M562 408h8M562 424h8M654 376h8M654 392h8M654 408h8M654 424h8"/>
    </g>
  </g>
  <!-- chave -->
  <g transform="rotate(-14 420 500)">
    <rect x="360" y="492" width="110" height="26" rx="10" fill="#2a2e34" stroke="#454b53" stroke-width="2"/>
    <rect x="392" y="492" width="12" height="26" fill="#2be06a"/>
    <rect x="470" y="501" width="120" height="8" rx="4" fill="#c3c8ce"/>
  </g>
</svg>
