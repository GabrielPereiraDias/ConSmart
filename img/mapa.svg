    @keyframes pulse{0%{transform:scale(.3);opacity:.7}100%{transform:scale(1.8);opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.25}}
  </style>
  <rect width="640" height="440" fill="#0e1012"/>
  <g fill="#14171a" stroke="#1d2125">
    <rect x="20" y="20" width="150" height="110" rx="10"/>
