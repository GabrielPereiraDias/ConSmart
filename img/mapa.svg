  <circle class="pulse" cx="330" cy="214" r="60" stroke="#2be06a" stroke-width="2"/>
  <circle class="pulse p2" cx="330" cy="214" r="60" stroke="#2be06a" stroke-width="2"/>
  <circle cx="330" cy="214" r="9" fill="#2be06a"/>
  <circle cx="330" cy="214" r="18" stroke="#2be06a" stroke-opacity=".45" stroke-width="2"/>
