<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fade" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#2be06a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2be06a" stop-opacity="0"/>
