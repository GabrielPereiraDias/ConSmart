<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4047"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <clipPath id="clip"><rect x="24" y="24" width="472" height="332" rx="14"/></clipPath>
  </defs>
  <style>
    .sweep{animation:sweep 4.2s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(300px);opacity:0}}
    .ring{transform-origin:372px 190px;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.sweep,.ring{animation:none}}
  </style>
  <rect x="4" y="4" width="512" height="372" rx="30" fill="url(#body)" stroke="#4d535b" stroke-width="2"/>
  <rect x="24" y="24" width="472" height="332" rx="14" fill="url(#scr)"/>
  <g clip-path="url(#clip)">
    <path d="M24 24H300L24 250Z" fill="#fff" opacity=".03"/>
    <rect x="48" y="52" width="150" height="12" rx="6" fill="#fff" opacity=".16"/>
    <rect x="48" y="76" width="100" height="9" rx="4.5" fill="#fff" opacity=".07"/>
    <g fill="#fff" opacity=".06">
      <rect x="48" y="120" width="190" height="64" rx="12"/>
      <rect x="48" y="198" width="190" height="64" rx="12"/>
      <rect x="48" y="276" width="190" height="52" rx="12"/>
    </g>
    <circle cx="372" cy="190" r="86" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
    <circle class="ring" cx="372" cy="190" r="86" stroke="#2be06a" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 450"/>
    <circle cx="372" cy="190" r="52" fill="#2be06a" fill-opacity=".08" stroke="#2be06a" stroke-opacity=".35"/>
    <path d="M352 192l14 14 28-30" stroke="#2be06a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="sweep" x="24" y="30" width="472" height="2" fill="#2be06a" opacity="0"/>
  </g>
  <circle cx="14" cy="190" r="3" fill="#0c0d10"/>
</svg>
