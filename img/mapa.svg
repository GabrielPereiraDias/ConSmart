    <rect x="320" y="20" width="140" height="100" rx="10"/>
    <rect x="480" y="20" width="140" height="130" rx="10"/>
    <rect x="20" y="150" width="110" height="130" rx="10"/>
    <rect x="150" y="120" width="150" height="110" rx="10"/>
    <rect x="360" y="150" width="100" height="90" rx="10"/>
    <rect x="480" y="170" width="140" height="110" rx="10"/>
    <rect x="20" y="300" width="170" height="120" rx="10"/>
    <rect x="210" y="250" width="110" height="170" rx="10"/>
    <rect x="340" y="260" width="130" height="80" rx="10"/>
